<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV waitlist</title><link rel="stylesheet" href="/bugbountycompany/style.css"><script src="/waitlist/app.js" defer></script></head><body><header><a href="/bugbountycompany/users/">Team workspace</a></header><main><section class="welcome"><div><p class="eyebrow">JOIN THE WAITLIST</p><h1>Drop your<br><em>CV here.</em></h1><p class="intro">Share your CV and we will get back to you.</p></div><form id="cv-form" class="panel"><h2>Your next step</h2><label>Your name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Drop your CV here<input name="cv" type="file" accept="application/pdf,.pdf" required></label><p class="small muted">PDF, up to 5 MB. Only the team owner can access your CV for recruitment.</p><button>Submit CV</button></form><section id="success" class="panel" hidden tabindex="-1"><h2>Thank you, we will get back to you.</h2><p>Your CV has been submitted.</p></section></section><p id="notice" role="status" aria-live="polite"></p></main></body></html>
